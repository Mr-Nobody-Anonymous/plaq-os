services:
  plaq:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PLAQ_DB_PATH: /data/plaq.db
      PLAQ_ARTIFACT_DIR: /data/artifacts
      PLAQ_HOST: 0.0.0.0
    volumes:
      - plaq-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  plaq-data:
