services:
  plaq:
    build: .
    ports:
      - "8000:8000"
    environment:
      PLAQ_DB_PATH: /data/plaq.db
      PLAQ_HOST: 0.0.0.0
      PLAQ_CORS_ORIGINS: "*"
      # Local compose: open API. Set PLAQ_API_KEY to lock it down.
      PLAQ_AUTH: "off"
    volumes:
      - plaq-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  plaq-data:
