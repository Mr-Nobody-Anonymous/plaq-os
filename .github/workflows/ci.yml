name: Plaq OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt
        pip install -e ./packages/contracts -e ./packages/sdk-python -e ./services/control-plane -e ./services/sandbox-manager -e ./services/model-gateway -e ./services/artifact-service -e ./services/agent-runtime -e ./engines/quantum -e ./apps/api -e ./apps/cli -e ./apps/mcp

    - name: Lint
      run: |
        ruff check --config ruff.toml apps services packages engines

    - name: Run unit test suite
      run: |
        pytest tests/ engines/quantum/tests -v --cov=. --cov-report=term-missing

    - name: Run E2E test suite
      run: |
        pytest tests/e2e -v

    - name: Smoke test CLI
      run: |
        python plaq.py --help
        python plaq.py quantum compile qft --qubits 4 --json
        python plaq.py quantum benchmark --json

    - name: Smoke test benchmark pipeline
      run: |
        python main.py --optimize --workload test_rz_cx_5q --hardware superconducting

  install-matrix:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Cross-platform install
      run: python scripts/install.py --skip-venv --dev --no-doctor
    - name: Doctor
      run: python plaq.py doctor --json
    - name: Smoke
      run: python plaq.py quantum run bell --json
