[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plaq-api"
version = "0.3.0"
description = "FastAPI Application Server for Plaq-OS"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "plaq-contracts",
    "plaq-control-plane",
    "plaq-agent-runtime",
    "plaq-quantum",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]
