[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plaq-cli"
version = "0.3.0"
description = "Unified Command Line Interface for Plaq-OS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "plaq-contracts>=0.3.0",
    "plaq-control-plane>=0.3.0",
    "plaq-sdk>=0.3.0",
    "plaq-quantum>=0.3.0",
]

[project.scripts]
plaq = "plaq_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
