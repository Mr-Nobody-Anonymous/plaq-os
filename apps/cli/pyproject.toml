[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plaq-cli"
version = "0.3.0"
description = "Unified Command Line Interface for Plaq-OS"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "plaq-contracts",
    "plaq-control-plane",
    "plaq-sdk",
    "plaq-quantum",
]

[project.scripts]
plaq = "plaq_cli.main:main"
