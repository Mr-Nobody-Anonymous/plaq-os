[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plaq-artifacts"
version = "0.1.0"
description = "Plaq-OS Content-Addressable Artifact Service & Control Plane Storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "plaq-contracts>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
